<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e32" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Safety Helmet Structure -->
  <g filter="url(#shadow)">
    <!-- Helmet Dome -->
    <path d="M 34 68 C 34 40, 94 40, 94 68 Z" fill="url(#helmetGrad)" />
    <!-- Helmet Ridge / Top Crest -->
    <path d="M 60 41 C 60 36, 68 36, 68 41 L 67 66 L 61 66 Z" fill="#cbd5e1" />
    <!-- Helmet Brim / Visor Base -->
    <path d="M 26 68 C 26 65, 33 64, 40 65 L 88 65 C 95 64, 102 65, 102 68 C 102 72, 26 72, 26 68 Z" fill="url(#helmetGrad)" />
    <path d="M 24 70 Q 64 74 104 70 C 104 73, 98 75, 88 75 L 40 75 C 30 75, 24 73, 24 70 Z" fill="#94a3b8" />
  </g>

  <!-- Safety / SST Green Cross Emblem -->
  <g transform="translate(64, 55)">
    <!-- Circle badge -->
    <circle r="12" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="1.5" />
    <!-- White Safety Cross -->
    <path d="M -3 -8 H 3 V -3 H 8 V 3 H 3 V 8 H -3 V 3 H -8 V -3 H -3 Z" fill="#ffffff" />
  </g>
</svg>
